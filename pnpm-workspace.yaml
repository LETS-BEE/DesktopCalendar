packages:
  - electron-disable-minimize

overrides:
  # @toast-ui/editor (unmaintained) pins dompurify@2.x which has open advisories;
  # force the patched 3.x line whose sanitize() API it uses is compatible.
  dompurify: ^3.4.17

allowBuilds:
  electron: true
  # Rebuilt explicitly against Electron headers by `pnpm native:rebuild`.
  electron-disable-minimize: false
  electron-winstaller: true
  esbuild: true
  vue-demi: true
verifyDepsBeforeRun: false
minimumReleaseAgeExclude:
  - globals@17.14.0
